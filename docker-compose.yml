# PostgreSQL para desarrollo y pruebas (alternativa a un PostgreSQL local).
# Puerto 5433 en el host para no chocar con una instalación local en 5432.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: farmacia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmacia_dev}
      POSTGRES_DB: farmacia_dev
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U farmacia -d farmacia_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
